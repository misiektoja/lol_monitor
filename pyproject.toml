[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lol_monitor"
version = "1.9"
description = "Tool implementing real-time tracking of LoL (League of Legends) players activities"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Michal Szymanski", email = "misiektoja-pypi@rm-rf.ninja" }]
requires-python = ">=3.12"
dependencies = [
  "pulsefire>=2.0.9",
  "requests>=2.0",
  "python-dateutil>=2.8",
  "python-dotenv>=0.19",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
keywords = ["lol", "riot","league-of-legends", "monitoring", "tracking", "real-time", "osint", "pulsefire"]

[project.optional-dependencies]
test = ["hypothesis>=6.100", "pytest>=7.0", "pyyaml>=6.0"]
# Pinned so a new ruff release cannot fail CI on a rule that did not exist when the change was written
lint = ["ruff==0.16.4"]

[project.urls]
Homepage = "https://github.com/misiektoja/lol_monitor"
Source   = "https://github.com/misiektoja/lol_monitor"
Changelog= "https://github.com/misiektoja/lol_monitor/blob/main/RELEASE_NOTES.md"

[project.scripts]
lol_monitor = "lol_monitor:main"

[tool.setuptools]
py-modules = ["lol_monitor"]
include-package-data = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Defect rules only: syntax errors, pyflakes and bugbear. Formatting and import order are left
# to the surrounding code, which keeps each function definition on one physical line
select = ["E9", "F", "B"]
# Both are style preferences that would rewrite hundreds of existing lines without fixing a defect
ignore = ["F541", "B904"]

[tool.pytest.ini_options]
# Run the in-repo source, never an installed copy, by putting the project root first on sys.path
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
